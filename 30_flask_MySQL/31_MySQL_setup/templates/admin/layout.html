<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <span>Admin Dashboard</span>
        <a href="{{ url_for('logout') }}" class="topbar-logout">Logout</a>
    </header>
    <div class="wrapper">
        <aside class="sidebar">
            <div class="sidebar-title">Admin Panel</div>
            <nav>
                <a href="{{ url_for('cashiers') }}"     class="{{ 'active' if request.endpoint == 'cashiers' }}">Cashiers</a>
                <a href="{{ url_for('products') }}"     class="{{ 'active' if request.endpoint == 'products' }}">Products</a>
                <a href="{{ url_for('transactions') }}" class="{{ 'active' if request.endpoint == 'transactions' }}">Transactions</a>
            </nav>
        </aside>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
