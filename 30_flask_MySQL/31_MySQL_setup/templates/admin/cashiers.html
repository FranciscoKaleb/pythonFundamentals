{% extends 'admin/layout.html' %}
{% block content %}

<div class="table-header">
    <h2>Cashiers</h2>
    <button class="btn-primary" onclick="showModal('register-modal')">+ Register New Cashier</button>
</div>

<table id="cashiers-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Last Name</th>
            <th>First Name</th>
            <th>Gender</th>
            <th>Age</th>
            <th>Email</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="cashiers-pagination" class="pagination"></div>

<!-- Register Modal -->
<div id="register-modal" class="modal-overlay">
    <div class="modal-card">
        <p class="modal-title">Register New Cashier</p>
        <div class="form-group"><label>Last Name</label><input id="reg-last-name"  type="text" placeholder="Last name"></div>
        <div class="form-group"><label>First Name</label><input id="reg-first-name" type="text" placeholder="First name"></div>
        <div class="form-group">
            <label>Gender</label>
            <select id="reg-gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <div class="form-group"><label>Age</label><input id="reg-age"      type="number" placeholder="Age"></div>
        <div class="form-group"><label>Email</label><input id="reg-email"    type="email"  placeholder="Email"></div>
        <div class="form-group"><label>Password</label><input id="reg-password" type="password" placeholder="Password"></div>
        <div class="modal-actions">
            <button id="cancel-register" class="btn-secondary">Cancel</button>
            <button id="confirm-register" class="btn-primary">Register</button>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div id="delete-modal" class="modal-overlay">
    <div class="modal-card">
        <p class="modal-title">Delete Cashier</p>
        <p class="modal-body">Are you sure you want to delete <strong id="delete-name"></strong>?</p>
        <div class="modal-actions">
            <button id="cancel-delete" class="btn-secondary">Cancel</button>
            <button id="confirm-delete" class="btn-danger">Delete</button>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="modal-overlay">
    <div class="modal-card">
        <p class="modal-title">Edit Cashier</p>
        <div class="form-group"><label>Last Name</label><input id="edit-last-name"  type="text"></div>
        <div class="form-group"><label>First Name</label><input id="edit-first-name" type="text"></div>
        <div class="form-group">
            <label>Gender</label>
            <select id="edit-gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <div class="form-group"><label>Age</label><input id="edit-age"   type="number"></div>
        <div class="form-group"><label>Email</label><input id="edit-email" type="email"></div>
        <div class="modal-actions">
            <button id="cancel-edit" class="btn-secondary">Cancel</button>
            <button id="save-edit"   class="btn-primary">Save</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="{{ url_for('static', filename='js/cashiers.js') }}"></script>
{% endblock %}
