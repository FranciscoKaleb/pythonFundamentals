{% extends 'admin/layout.html' %}
{% block content %}
<h2>Products</h2>

<table id="products-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="products-pagination" class="pagination"></div>

<!-- Delete Modal -->
<div id="delete-modal" class="modal-overlay">
    <div class="modal-card">
        <p class="modal-title">Delete Product</p>
        <p class="modal-body">Are you sure you want to delete <strong id="delete-name"></strong>?</p>
        <div class="modal-actions">
            <button id="cancel-delete" class="btn-secondary">Cancel</button>
            <button id="confirm-delete" class="btn-danger">Delete</button>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="modal-overlay">
    <div class="modal-card">
        <p class="modal-title">Edit Product</p>
        <div class="form-group"><label>Product Name</label><input id="edit-product-name" type="text"></div>
        <div class="form-group"><label>Category</label><input id="edit-category" type="text"></div>
        <div class="form-group"><label>Price</label><input id="edit-price" type="number" step="0.01"></div>
        <div class="form-group"><label>Stock</label><input id="edit-stock" type="number"></div>
        <div class="modal-actions">
            <button id="cancel-edit" class="btn-secondary">Cancel</button>
            <button id="save-edit"   class="btn-primary">Save</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="{{ url_for('static', filename='js/products.js') }}"></script>
{% endblock %}
